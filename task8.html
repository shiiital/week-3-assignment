<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shital Achhami Portfolio</title>
  <style>
    /* 1. Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 2. Base styles */
    body { font-family: sans-serif; background: #f3f4f6; color: #111827; }
    a { text-decoration: none; color: inherit; }
    h1, h2, h3 { font-weight: bold; }
    p { line-height: 1.5; }

    /* 3. Navigation */
    .nav {
      background: #111827;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
    }
    .nav-logo { font-weight: bold; font-size: 1.2rem; }
    .nav-links { display: flex; gap: 16px; }
    .nav-links a { color: white; font-size: 0.95rem; }
    .nav-links a:hover { color: #10b981; }

    /* 4. Hero section */
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: white;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 12px; }
    .hero p { color: #64748b; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn:hover { background: #059669; }

    /* 5. Skills grid */
    .skills-section {
      padding: 60px 20px;
      text-align: center;
    }
    .skills-section h2 { font-size: 2rem; margin-bottom: 32px; }
    .skills-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .skill-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .skill-card h3 { margin-bottom: 8px; color: #10b981; }
    .skill-card p { color: #64748b; font-size: 0.9rem; }

    /* 6. Footer */
    .footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>

  </nav>
